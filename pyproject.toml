
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discrete-log"
version = "0.1.0"
description = "A Python library implementing discrete logarithm algorithms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pylint",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
py-version = "3.12"
